name: Deploy Bookshelf to GitHub Pages

on:
  push:
    branches: [main]
    paths:
      - 'bookshelf/**'
      - '.github/workflows/deploy-bookshelf.yml'
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: bookshelf/package-lock.json

      - name: Install dependencies
        working-directory: bookshelf
        run: npm ci

      - name: Build
        working-directory: bookshelf
        run: npm run build

      - name: Prepare pages directory
        run: |
          mkdir -p _site/bookshelf
          cp -r bookshelf/dist/* _site/bookshelf/

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: _site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
